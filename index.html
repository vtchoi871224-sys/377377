<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Archive</title>

<style>
:root {
    --bg: #fafafa;
    --white: #ffffff;
    --primary: #18181b;
    --accent: #2563eb;
    --text: #27272a;
    --muted: #71717a;
    --line: #e4e4e7;
    --code-bg: #18181b;
    --code-text: #f4f4f5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
}

header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 24px 32px;
}

.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.5px;
}

main {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 24px;
}

.toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

input, select, textarea {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    background: var(--white);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
}

#search {
    flex: 1;
    min-width: 240px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    background: var(--primary);
    color: white;
    transition: opacity 0.2s;
}

button:hover {
    opacity: 0.9;
}

button.secondary {
    background: var(--white);
    color: var(--text);
    border: 1px solid var(--line);
}

button.secondary:hover {
    background: #f4f4f5;
}

button.ghost {
    background: transparent;
    color: var(--muted);
    padding: 6px 10px;
}

button.ghost:hover {
    color: var(--text);
    background: #f4f4f5;
}

.layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 24px;
    align-items: start;
}

aside {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    position: sticky;
    top: 24px;
}

aside h3 {
    margin: 8px 12px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.cat {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    margin: 2px 0;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 400;
}

.cat:hover {
    background: #f4f4f5;
}

.cat.active {
    background: #eff6ff;
    color: var(--accent);
    font-weight: 500;
}

#count {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
}

.card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.cardtop {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
}

.card h3 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.3px;
}

.tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    background: #eff6ff;
    border-radius: 6px;
    padding: 4px 8px;
    white-space: nowrap;
}

.desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px 0;
    line-height: 1.4;
}

pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 8px;
    padding: 14px;
    font: 12px/1.5 Consolas, Monaco, monospace;
    max-height: 220px;
    overflow: auto;
    margin: 0 0 16px 0;
}

.actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.actions button {
    font-size: 12px;
    padding: 7px 12px;
}

.empty {
    background: var(--white);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 48px;
    text-align: center;
    color: var(--muted);
    grid-column: 1 / -1;
}

.editor {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-top: 24px;
    padding: 24px;
}

.editor h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 16px 0;
}

.fields {
    display: grid;
    grid-template-columns: 1fr 200px;
    gap: 12px;
    margin-bottom: 12px;
}

.fields textarea {
    grid-column: 1 / -1;
    min-height: 140px;
    font-family: Consolas, Monaco, monospace;
}

.editor input,
.editor select,
.editor textarea {
    width: 100%;
}

@media(max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; }
    .fields { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Command Archive</h1>
    </div>
</header>

<main>

<div class="toolbar">
    <input id="search" placeholder="검색어 입력...">
    <select id="sortCat">
        <option value="전체">모든 카테고리</option>
    </select>
    <button class="secondary" id="showAdd">＋ 새로 만들기</button>
</div>

<div class="layout">

<aside>
    <h3>Categories</h3>
    <div id="categories"></div>
</aside>

<section>
    <div id="count"></div>
    <div class="cards" id="cards"></div>
</section>

</div>

<section class="editor" id="editor" hidden>
    <h2>새 메모 추가</h2>
    <div class="fields">
        <input id="newTitle" placeholder="제목">
        <select id="newCat">
            <option>Windows</option>
            <option>PowerShell</option>
            <option>네트워크</option>
            <option>하드웨어</option>
            <option>Linux</option>
            <option>부팅·복구</option>
            <option>기타</option>
        </select>
        <input id="newDesc" placeholder="간단한 설명">
        <textarea id="newCode" placeholder="실행 명령어 코드"></textarea>
    </div>
    <div class="actions">
        <button id="saveMemo">저장하기</button>
        <button class="secondary" id="cancelMemo">취소</button>
    </div>
</section>

</main>

<script>
const defaults = [
{
id:'ipconfig',
title:'IP 설정 전체 확인',
cat:'네트워크',
desc:'IP, 게이트웨이, DNS 정보 확인',
code:'ipconfig /all'
},
{
id:'flushdns',
title:'DNS 캐시 초기화',
cat:'네트워크',
desc:'DNS 캐시 초기화',
code:'ipconfig /flushdns'
},
{
id:'ping',
title:'연결 상태 확인',
cat:'네트워크',
desc:'대상 IP 연결 테스트',
code:'ping 8.8.8.8'
},
{
id:'port',
title:'TCP 포트 연결 테스트',
cat:'네트워크',
desc:'특정 포트 연결 여부 확인',
code:'Test-NetConnection 192.168.0.10 -Port 8001'
},
{
id:'netstat',
title:'열린 포트 확인',
cat:'네트워크',
desc:'네트워크 연결 및 PID 확인',
code:'netstat -ano'
},
{
id:'adapter',
title:'네트워크 어댑터 상태',
cat:'네트워크',
desc:'네트워크 카드 상태 및 속도',
code:'Get-NetAdapter | Format-Table Name, Status, LinkSpeed'
},
{
id:'bios',
title:'BIOS 및 시리얼 확인',
cat:'하드웨어',
desc:'BIOS 버전, 날짜, 제조번호',
code:'Get-CimInstance Win32_BIOS | Format-List Manufacturer, SMBIOSBIOSVersion, ReleaseDate, SerialNumber'
},
{
id:'model',
title:'PC 모델 및 제조사',
cat:'하드웨어',
desc:'컴퓨터 모델명 확인',
code:'Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model'
},
{
id:'ram',
title:'메모리 정보',
cat:'하드웨어',
desc:'RAM 용량, 속도, 제조사',
code:'Get-CimInstance Win32_PhysicalMemory | Select-Object DeviceLocator, Capacity, Speed, ConfiguredClockSpeed, Manufacturer, PartNumber'
},
{
id:'sysinfo',
title:'시스템 정보 실행',
cat:'Windows',
desc:'Windows 시스템 정보 창 실행',
code:'msinfo32'
},
{
id:'sfc',
title:'시스템 파일 검사',
cat:'Windows',
desc:'손상된 Windows 파일 검사 및 복구',
code:'sfc /scannow'
},
{
id:'laptopinfo',
title:'노트북 장비 정보 GUI',
cat:'PowerShell',
desc:'사용자, PC 이름, 모델명, BIOS 날짜, 시리얼, IP, MAC 주소 표시',
code:`Add-Type -AssemblyName System.Windows.Forms
Add-Type -AssemblyName System.Drawing

# 1. 장비 정보 수집
$bios = Get-CimInstance Win32_BIOS
$cs = Get-CimInstance Win32_ComputerSystem
$board = Get-CimInstance Win32_BaseBoard

$ip = Get-NetIPAddress -AddressFamily IPv4 |
    Where-Object {
        $_.InterfaceAlias -notmatch 'Loopback' -and
        $_.IPAddress -notlike '169.254*'
    } | Select-Object -First 1

$nic = Get-NetAdapter |
    Where-Object Status -eq 'Up' |
    Select-Object -First 1

# 2. 날짜 및 네트워크 정보 가공
$date = if ($bios.ReleaseDate) {
    $bios.ReleaseDate.ToString('yyyy-MM-dd')
} else { '확인 불가' }

$ipaddr = if ($ip) { $ip.IPAddress } else { '확인 불가' }
$mac = if ($nic) {
    $nic.MacAddress -replace '-', ':'
} else {
    '확인 불가'
}

# 3. GUI 창 생성
$form = New-Object System.Windows.Forms.Form
$form.Text = '노트북 장비 정보'
$form.Size = New-Object System.Drawing.Size(500, 490)
$form.StartPosition = 'CenterScreen'
$form.BackColor = [System.Drawing.Color]::White
$form.FormBorderStyle = 'FixedDialog'
$form.MaximizeBox = $false
$form.KeyPreview = $true

# 4. 제목 라벨
$title = New-Object System.Windows.Forms.Label
$title.Text = '노트북 장비 정보'
$title.Font = New-Object System.Drawing.Font('맑은 고딕', 18, [System.Drawing.FontStyle]::Bold)
$title.Location = New-Object System.Drawing.Point(30, 20)
$title.Size = New-Object System.Drawing.Size(420, 45)
$form.Controls.Add($title)

# 5. 표시 항목 정의 (베이스보드 Product 정보 반영)
$items = @(
    @('유저네임', $env:USERNAME),
    @('호스트 네임', $env:COMPUTERNAME),
    @('모델명', $board.Product),
    @('BIOS 날짜', $date),
    @('제조번호', $bios.SerialNumber),
    @('IP 주소', $ipaddr),
    @('MAC 주소', $mac)
)

$y = 85

foreach ($item in $items) {
    $label = New-Object System.Windows.Forms.Label
    $label.Text = $item[0]
    $label.Location = New-Object System.Drawing.Point(30, $y)
    $label.Size = New-Object System.Drawing.Size(140, 30)
    $label.Font = New-Object System.Drawing.Font('맑은 고딕', 10)
    $form.Controls.Add($label)

    $value = New-Object System.Windows.Forms.TextBox
    $value.Text = [string]$item[1]
    $value.Location = New-Object System.Drawing.Point(175, $y)
    $value.Size = New-Object System.Drawing.Size(275, 30)
    $value.ReadOnly = $true
    $value.Font = New-Object System.Drawing.Font('맑은 고딕', 10)
    $form.Controls.Add($value)

    $y += 42
}

# 6. 닫기 버튼 생성
$btn = New-Object System.Windows.Forms.Button
$btn.Text = '닫기 (K)'
$btn.Location = New-Object System.Drawing.Point(350, 390)
$btn.Size = New-Object System.Drawing.Size(100, 35)
$btn.Add_Click({ $form.Close() })
$form.Controls.Add($btn)

# 7. 키보드 이벤트 (K 키로 종료)
$form.Add_KeyDown({
    if ($_.KeyCode -eq [System.Windows.Forms.Keys]::K) {
        $form.Close()
    }
})

# 8. GUI 실행
[void]$form.ShowDialog()`
},
{
id:'linuxip',
title:'Linux IP 주소 확인',
cat:'Linux',
desc:'네트워크 인터페이스 IP 확인',
code:'ip -br addr'
},
{
id:'route',
title:'Linux 라우팅 확인',
cat:'Linux',
desc:'기본 게이트웨이 및 라우팅 확인',
code:'ip route'
}
];

const KEY = 'commandArchive_v2';
let saved = [];

try {
    saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (!Array.isArray(saved)) saved = [];
} catch {
    saved = [];
}

let memos = [
    ...defaults.map(x => ({...x, builtin:true})),
    ...saved.map(x => ({...x, builtin:false}))
];

let active = '전체';
const $ = id => document.getElementById(id);

function save() {
    localStorage.setItem(KEY, JSON.stringify(memos.filter(x => !x.builtin)));
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
}

function render() {
    const cats = ['전체', ...new Set(memos.map(x => x.cat))];

    $('categories').innerHTML = cats.map(c => `
        <button class="cat ${active === c ? 'active' : ''}" data-cat="${esc(c)}">
            ${esc(c)}
        </button>
    `).join('');

    $('sortCat').innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c === '전체' ? '모든 카테고리' : c)}</option>`).join('');
    $('sortCat').value = active;

    const q = $('search').value.trim().toLowerCase();
    const list = memos.filter(x => 
        (active === '전체' || x.cat === active) &&
        [x.title, x.desc, x.code, x.cat].join(' ').toLowerCase().includes(q)
    );

    $('count').textContent = `총 ${list.length}개의 항목`;

    $('cards').innerHTML = list.length ? list.map(x => `
        <article class="card">
            <div>
                <div class="cardtop">
                    <h3>${esc(x.title)}</h3>
                    <span class="tag">${esc(x.cat)}</span>
                </div>
                <p class="desc">${esc(x.desc)}</p>
                <pre>${esc(x.code)}</pre>
            </div>
            <div class="actions">
                <button data-copy="${esc(x.id)}">복사하기</button>
                ${x.builtin ? '' : `<button class="ghost" data-delete="${esc(x.id)}">삭제</button>`}
            </div>
        </article>
    `).join('') : '<div class="empty">검색 결과가 없습니다.</div>';
}

$('categories').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (b) { active = b.dataset.cat; render(); }
});

$('sortCat').addEventListener('change', e => {
    active = e.target.value;
    render();
});

$('search').addEventListener('input', render);

$('cards').addEventListener('click', async e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) {
        const item = memos.find(x => x.id === copy.dataset.copy);
        if (!item) return;
        try {
            await navigator.clipboard.writeText(item.code);
        } catch {
            const t = document.createElement('textarea');
            t.value = item.code;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            t.remove();
        }
        const original = '복사하기';
        copy.textContent = '완료';
        setTimeout(() => { copy.textContent = original; }, 1200);
    }

    const del = e.target.closest('[data-delete]');
    if (del && confirm('정말 삭제하시겠습니까?')) {
        memos = memos.filter(x => x.id !== del.dataset.delete);
        save();
        render();
    }
});

$('showAdd').onclick = () => {
    $('editor').hidden = false;
    $('newTitle').focus();
};

$('cancelMemo').onclick = () => {
    $('editor').hidden = true;
};

$('saveMemo').onclick = () => {
    const title = $('newTitle').value.trim();
    const code = $('newCode').value.trim();
    if (!title || !code) {
        alert('제목과 명령어를 입력해주세요.');
        return;
    }
    memos.push({
        id: 'm' + Date.now(),
        title: title,
        cat: $('newCat').value,
        desc: $('newDesc').value.trim(),
        code: code,
        builtin: false
    });
    save();
    $('newTitle').value = '';
    $('newDesc').value = '';
    $('newCode').value = '';
    $('editor').hidden = true;
    active = '전체';
    render();
};

render();
</script>

</body>
</html>
